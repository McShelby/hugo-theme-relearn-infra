name: test-execution

# Validates a change to the test suite itself. The mirror of this workflow
# lives in the theme repo and holds the opposite side fixed. Both delegate to
# the run-test action, so the actual procedure exists once.

# Runs on every branch and every pull request, and nightly. It never releases,
# deploys or publishes anything, and it is deliberately not hand-triggerable.
on:
  push:
  pull_request:
  schedule:
    # Hugo breaks themes on its own schedule; find out from CI, not from an
    # issue report.
    - cron: '17 4 * * *'

# Declared rather than inherited, so the workflow does not depend on a
# repository setting that differs between an old repository and a new one.
permissions:
  contents: read

jobs:
  test:
    name: hugo ${{ matrix.hugo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo: [min, latest]
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          path: infra

      # Mirror of the theme repo's lookup: a change spanning both repositories
      # is reviewed as a pair of same-named branches. Everything else runs
      # against theme main. This step cannot be a composite action, because
      # resolving the ref is what tells us which checkout to take it from.
      #
      # The theme is this repository's name without the `-infra` suffix, so a
      # fork or a throwaway `test-` copy of the pair stays inside itself. The
      # guard matters: the suffix strip leaves a non-matching name untouched,
      # which would check this repository out as the theme and run the suite
      # green against a checkout with no theme in it.
      - name: Pick theme repository and branch
        id: pick
        shell: bash
        run: |
          SIBLING="${GITHUB_REPOSITORY%-infra}"
          if [ "$SIBLING" = "$GITHUB_REPOSITORY" ]; then
            echo "Expected this repository to be named *-infra, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads \
               "https://github.com/${SIBLING}" "$BRANCH" >/dev/null 2>&1; then
            REF="$BRANCH"
          else
            REF=main
          fi
          echo "repo=$SIBLING" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using $SIBLING branch $REF"

      - name: Checkout theme
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pick.outputs.repo }}
          ref: ${{ steps.pick.outputs.ref }}
          path: theme

      # Referenced through the checkout rather than by @main, so a pull request
      # here tests its own version of the action.
      - name: Run tests
        uses: ./infra/.github/actions/run-test
        with:
          theme_dir: theme
          infra_dir: infra
          hugo: ${{ matrix.hugo }}
