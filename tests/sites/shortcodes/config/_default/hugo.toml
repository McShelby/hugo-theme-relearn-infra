# One page per shortcode family.
#
# Kept small on purpose: a diff here should be readable, so a change to the
# badge markup shows up as a handful of lines in badge.html rather than being
# buried in a 2000-file docs rebuild.

# Served from a webserver and from the file system alike: no host to bake into
# a page, and site-relative URLs rewritten relative to the page carrying them.
baseURL = '/'
relativeURLs = true

title = 'Shortcodes'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
