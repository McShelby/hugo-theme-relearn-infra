# Shared base for every URL permutation.
#
# The `urls` axis changes only the URL settings, so a diff between two of its
# values shows link generation and nothing else. Nothing about reproducibility
# lives here - that is the `testing` environment's job.

title = 'URL Permutations'

# The theme's `source` output format: a page rendered as the file it came from,
# front matter and all. Its `noUgly` is what the `ugly` value of the axis puts
# to the test - one suffix per mime type, so this one URL stays as it is.
[outputs]
  home = ['html', 'rss', 'source']
  section = ['html', 'rss', 'source']
  page = ['html', 'source']
