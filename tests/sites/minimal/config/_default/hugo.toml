# The convention-over-configuration fixture.
#
# Deliberately the smallest config a Relearn site can have: where it is served
# from, and what it is called. If the theme ever starts requiring a setting to
# produce sane output, this fixture is what notices.
#
# The theme is supplied by the runner via --themesDir/--theme, so that a
# checkout under any directory name works. Reproducibility comes from the
# `testing` environment, which the case names.

# Served from a webserver and from the file system alike: no host to bake into
# a page, and site-relative URLs rewritten relative to the page carrying them.
baseURL = '/'
relativeURLs = true

title = 'Minimal'
