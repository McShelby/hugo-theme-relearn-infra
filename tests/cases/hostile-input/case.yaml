# Hostile values in every place an author can put a value into an attribute,
# taken from established collections of such input. Each must come out as the
# text it is - never ending its attribute, never decoded into markup.
#
# The `unsafe` axis decides whether Goldmark drops the markup some hostile
# values spell. Script URLs are refused either way, like Hugo's own templates
# refuse them; built both ways, the same link shows up replaced both times.

site: hostile-input
environment: testing

axes:
  unsafe:
    - 'off'
    - 'on'
